services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_RAW   # autorise le ping depuis le conteneur
    ports:
      - "8000:8000"

volumes:
  pgdata:
